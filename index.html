<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PU Ra Book Store</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- របារក្បាលទំព័រ -->
    <header>
      <h1>📚 PU Ra Book Store</h1>
      <p>បណ្ដុំសៀវភៅចំណេះដឹង និងបច្ចេកវិទ្យាឈានមុខ</p>
    </header>

    <!-- របារ Menu -->
    <nav class="navbar">
      <a href="#" class="active">ទំព័រដើម</a>
      <a href="#">សៀវភៅទាំងអស់</a>
      <a href="#">ការបញ្ជាទិញ</a>
      <a href="#">ទាក់ទងយើង</a>
    </nav>

    <!-- ផ្នែកបង្ហាញសៀវភៅ -->
    <main class="container">
      <h2 class="section-title">✨ សៀវភៅណែនាំសម្រាប់អ្នក</h2>

      <div class="book-grid">
        <!-- ឡូកសៀវភៅទី ១ -->
        <div class="book-card">
          <div class="book-cover">📘</div>
          <h3>រៀនសរសេរកូដដំបូង</h3>
          <p class="author">ដោយ៖ ភូរ៉ា អាយធី</p>
          <p class="price">$15.00</p>
          <button class="buy-btn">ទិញឥឡូវនេះ</button>
        </div>

        <!-- ឡូកសៀវភៅទី ២ -->
        <div class="book-card">
          <div class="book-cover">📙</div>
          <h3>មូលដ្ឋានគ្រឹះ Git & GitHub</h3>
          <p class="author">ដោយ៖ ភូរ៉ា អាយធី</p>
          <p class="price">$12.50</p>
          <button class="buy-btn">ទិញឥឡូវនេះ</button>
        </div>

        <!-- ឡូកសៀវភៅទី ៣ -->
        <div class="book-card">
          <div class="book-cover">📗</div>
          <h3>បណ្ដាញកុំព្យូទ័រគ្រឹះ</h3>
          <p class="author">ដោយ៖ ភូរ៉ា អាយធី</p>
          <p class="price">$18.00</p>
          <button class="buy-btn">ទិញឥឡូវនេះ</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
